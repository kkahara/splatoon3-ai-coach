video:
  max_width: 1920
  max_height: 1080

paths:
  frame_output: "./frames"
  manifest_output: "./manifests"

extraction:
  analysis_fps: 6
  scene_threshold: 0.72
  ssim_threshold: 0.80
  motion_threshold: 0.75
  hud_threshold: 0.20
  min_event_gap_seconds: 0.75
  context_before_seconds: 1.5
  context_after_seconds: 1.0
  max_frames_per_minute: 90
  save_jpeg_quality: 92
  hud:
    killfeed: [0.68, 0.02, 0.99, 0.30]
    special_gauge: [0.35, 0.00, 0.65, 0.12]
    objective_timer: [0.470, 0.045, 0.530, 0.095]
    death_text: [0.20, 0.25, 0.80, 0.70]

vision:
  # Analysis-level UI language (en|ja). Text/OCR template packs load only from
  # template_dir/<language>/ (respawn, splat, death/ouch, death/splatted).
  # Selected once per analysis; never inferred per frame.
  language: en
  ocr:
    engine: tesseract
    tesseract_languages:
      en: eng
      ja: jpn
  enabled_detectors: ["timer", "death", "splat", "respawn", "active_gameplay", "map_overlay"]
  # Sole visual-analysis sampling rate. Detectors do not schedule themselves.
  hud_cadence_fps: 2.0
  timer:
    roi: [0.470, 0.045, 0.530, 0.095]
    template_dir: "../calibration/templates"
    match_threshold: 0.55
    min_usable_confidence: 0.50
  death:
    # 1080p pixels: ouch [880:940, 20:200], banner [980:1050, 660:1260]
    ouch_roi: [0.0104167, 0.8148148, 0.1041667, 0.8703704]
    banner_roi: [0.34375, 0.9074074, 0.65625, 0.9722222]
    template_dir: "../calibration/templates/death"
    # Glyph/template is the primary Ouch cue (real deaths ~0.95+; FP ~0.4).
    ouch_match_threshold: 0.70
    banner_match_threshold: 0.55
    ouch_require_glyph: true
    ouch_white_ratio: 0.12
    ouch_max_saturation: 0.30
    ouch_max_yellow_ratio: 0.15
    # Supporting only — do not tune this as a solo death separator.
    banner_dark_threshold: 0.72
    debounce_seconds: 3.0
    min_usable_confidence: 0.50
  splat:
    # Tall enough for a 3-stack local-kill banner; do not widen into the kill-feed.
    banner_roi: [0.35, 0.80, 0.65, 0.98]
    template_dir: "../calibration/templates/splat"
    # Real local-kill icons ~0.95; kill-feed skulls ~0.60–0.70.
    skull_match_threshold: 0.80
    # 「をたおした」/Splatted on the local banner; kill-feed names score ~0.3–0.5.
    text_match_threshold: 0.70
    white_value_threshold: 230
    adjacent_color_min_ratio: 0.20
    adjacent_min_saturation: 50
    debounce_seconds: 0.0
    min_usable_confidence: 0.50
  respawn:
    # BR plate covers EN “Respawn in N” (~y=0.83) and JA 「復活まであと」 (~y=0.90)
    roi: [0.840, 0.825, 1.000, 0.950]
    template_dir: "../calibration/templates/respawn"
    match_threshold: 0.60
    support_match_threshold: 0.55
    dark_frac_min: 0.25
    bright_frac_min: 0.08
    p95_min: 0.75
    yellow_frac_digit_box_min: 0.12
    min_usable_confidence: 0.50
    debounce_seconds: 0.0
    hold_seconds: 2.0
  active_gameplay:
    # Evidence only: BL HUD chrome. Weapon/center feed return_control.
    # Match phase (intro / opening countdown / in_match) lives in lifecycle.
    weapon_roi: [0.32, 0.48, 0.68, 0.90]
    hud_roi: [0.01, 0.78, 0.22, 0.98]
    center_roi: [0.46, 0.40, 0.54, 0.62]
    weapon_edge_min: 0.035
    weapon_luma_std_min: 0.08
    hud_edge_min: 0.020
    center_edge_min: 0.045
    min_usable_confidence: 0.50
    debounce_seconds: 0.0
  map_overlay:
    # Top-left close “X” (1080p ~[27:341, 19:182])
    map_roi: [0.0208, 0.0324, 0.1536, 0.1620]
    tank_roi: [0.46, 0.40, 0.54, 0.62]
    periphery_roi: [0.02, 0.02, 0.98, 0.98]
    template_dir: "../calibration/templates/map_overlay"
    match_threshold: 0.70
    map_edge_min: 0.045
    tank_edge_max: 0.055
    periphery_blur_min: 0.55
    min_usable_confidence: 0.50
    debounce_seconds: 0.0
  # HUD death-X roster counts. Off by default — enable "player_count" in
  # enabled_detectors after verifying templates/ROIs. Slot boxes are
  # fractional (x1,y1,x2,y2) @ 1920×1080. Pixel xywh origins:
  # ally-1 [488,17,143,105] ally-2 [592,19,129,102] ally-3 [689,12,110,110]
  # ally-4 [782,15,110,110] opp-1 [1030,15,111,110] opp-2 [1124,15,109,110]
  # opp-3 [1197,19,112,100] opp-4 [1276,15,141,103]
  player_count:
    ally_slots:
      - [0.254167, 0.015741, 0.328646, 0.112963]
      - [0.308333, 0.017593, 0.375521, 0.112037]
      - [0.358854, 0.011111, 0.416146, 0.112963]
      - [0.407292, 0.013889, 0.464583, 0.115741]
    opponent_slots:
      - [0.536458, 0.013889, 0.594271, 0.115741]
      - [0.585417, 0.013889, 0.642188, 0.115741]
      - [0.623437, 0.017593, 0.681771, 0.110185]
      - [0.664583, 0.013889, 0.738021, 0.109259]
    template_dir: "../calibration/templates/players"
    # Masked TM_SQDIFF_NORMED: score <= threshold ⇒ X (lower=better).
    sqdiff_match_threshold: 0.08
    min_usable_confidence: 0.50
  state_fusion:
    smoothing_window: 5
    max_hold_duration: 2.0
    dedupe_tolerance_seconds: 0.05
  lifecycle:
    countdown_present_min_observations: 2
    countdown_absent_min_observations: 2
    # Unused: RESPAWNED arms awaiting_control directly (plate end == no control).
    awaiting_control_absent_min_observations: 2
    active_again_min_observations: 2
    active_again_max_gap_observations: 1
    # HUD+timer mid-tier cannot fire until this long after latch arm.
    active_again_mid_tier_delay_seconds: 2.5
    # Plate-less deaths (water / wipeout) may leave DEAD after this delay.
    dead_skip_countdown_min_seconds: 6.5
    dead_skip_countdown_min_observations: 3
    max_respawn_observation_seconds: 30.0
    stale_to_unknown: true
    death_requires_match_context: true
    match_context_hold_seconds: 20.0
    opening_clock_seconds: [180, 300]
  events:
    debounce_ms: 300
    splat_absent_min_observations: 2
    splat_fingerprint_max_distance: 10
    splat_slot_nearby: 0.18

scenarios:
  post_death_follow_seconds: 8.0
  post_death_max_seconds: 30.0
  engagement_gap_seconds: 3.0
  engagement_include_following_death_seconds: 2.0

coach:
  provider: ollama
  model: gpt-oss:20b
  baseline_model: llama3.1:8b
  ollama_base_url: http://127.0.0.1:11434
  game_clock_max_lookup_gap_seconds: 1.0
  player_count_max_lookup_gap_seconds: 1.0
