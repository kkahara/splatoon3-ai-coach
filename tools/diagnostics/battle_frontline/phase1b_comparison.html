<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
  body { font: 15px system-ui; background: #101722; color: #edf2fa; margin: 0; padding: 22px; }
  main { max-width: 1500px; margin: auto; }
  .bar, .panels { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  select { font: inherit; padding: 9px; background: #26344a; color: white; border: 1px solid #789; border-radius: 7px; }
  .note { background: #26344a; padding: 14px; border-radius: 8px; line-height: 1.5; margin: 14px 0; }
  .panels { align-items: stretch; }
  section { flex: 1 1 500px; min-width: 320px; background: #182230; padding: 12px; border-radius: 10px; }
  .image { position: relative; width: 100%; background: #080d13; }
  .image img { width: 100%; display: block; }
  .image svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .human { stroke: #18e6f2; stroke-width: 0.6; fill: none; vector-effect: non-scaling-stroke; }
  .generated { stroke: #ff4b61; stroke-width: 0.55; fill: none; vector-effect: non-scaling-stroke; }
  .region { stroke: #ffd14a; stroke-width: 0.45; fill: #ffd14a22; vector-effect: non-scaling-stroke; }
  .muted { color: #bac7d8; }
  .unavailable { border-left: 5px solid #ffc857; padding: 10px; background: #302a1d; }
  code { overflow-wrap: anywhere; }
  li { margin: 4px 0; }
  h1 { margin-top: 0; }
</style>
<main>
  <h1>__TITLE__</h1>
  <p class="note">Read-only inspection. Cyan is the frozen independent human line; red is an exact-frame saved paint-only prediction. A missing prediction is shown as unavailable; this page does not run classification or change annotations.</p>
  <div class="bar">
    <label>Frame <select id="case"></select></label>
    <span id="status" class="muted"></span>
  </div>
  <div class="panels">
    <section><h2>Human baseline</h2><div id="human"></div><div id="humanMeta"></div></section>
    <section><h2>Paint-only model</h2><div id="model"></div><div id="modelMeta"></div></section>
  </div>
</main>
<script>
const DATA = __DATA__;
const $ = (id) => document.getElementById(id);
const select = $('case');

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, (character) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[character]);
}

function pathMarkup(points, className) {
  if (!points || points.length < 2) return '';
  const coordinates = points.map((point) => `${point.x * 100},${point.y * 100}`).join(' ');
  return `<polyline class="${className}" points="${coordinates}"/>`;
}

function imagePanel(source, item, model) {
  const paths = [];
  if (model) {
    for (const segment of item.generated_segments || []) {
      paths.push(pathMarkup(segment, 'generated'));
    }
  } else {
    for (const shape of item.human_shapes || []) {
      paths.push(pathMarkup(shape.points, shape.kind === 'boundary' ? 'human' : 'region'));
    }
  }
  return `<div class="image"><img src="${escapeHtml(source)}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${paths.join('')}</svg></div>`;
}

function showCase() {
  const item = DATA.cases.find((row) => row.case_id === select.value);
  if (!item) return;
  $('status').textContent = `${item.recording_filename} · t=${item.video_time.toFixed(3)}s · ${item.human_judgment}`;
  $('human').innerHTML = imagePanel(item.source_image, item, false);
  $('humanMeta').innerHTML = `<p>Judgment: <b>${escapeHtml(item.human_judgment)}</b></p><p>Reasons: ${escapeHtml((item.human_reasons || []).join(', ') || 'none selected')}</p><p>${escapeHtml(item.human_explanation || 'No explanation entered.')}</p>`;
  if (item.prediction_status === 'existing_exact_prediction') {
    $('model').innerHTML = imagePanel(item.paint_image, item, true);
    $('modelMeta').innerHTML = `<p>Exact-frame saved prediction. Polygon <code>${escapeHtml(item.polygon_sha256)}</code>; classifier <code>${escapeHtml(item.classifier_config_sha256)}</code>.</p>`;
    return;
  }
  $('model').innerHTML = imagePanel(item.source_image, item, true);
  $('modelMeta').innerHTML = `<div class="unavailable"><b>No valid prediction for this frame.</b><ul>${item.unavailable_reasons.map((reason) => `<li>${escapeHtml(reason)}</li>`).join('')}</ul><p>The source image is shown without a generated line.</p></div>`;
}

for (const item of DATA.cases) {
  const option = document.createElement('option');
  option.value = item.case_id;
  option.textContent = `M${String(item.recording_index).padStart(2, '0')} · ${item.case_id} · ${item.human_judgment} · ${item.prediction_status === 'unavailable' ? 'unavailable' : 'exact model'}`;
  select.append(option);
}
select.addEventListener('change', showCase);
showCase();
</script>
</html>
