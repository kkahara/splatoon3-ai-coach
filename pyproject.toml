[project]
name = "splatoon3-ai-coach"
version = "0.2.0"
description = "Analyze Splatoon 3 gameplay video and provide evidence-based coaching."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "av>=14.0",
    "opencv-python-headless>=4.10",
    "loguru>=0.7",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "rich>=13.9",
    "typer>=0.15",
]

[project.optional-dependencies]
display = [
    "opencv-python>=4.10",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "httpx>=0.27",
]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
]

[project.scripts]
s3-coach = "splatoon3_ai_coach.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/splatoon3_ai_coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "-ra"

[tool.ruff]
line-length = 90

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer declares CLI options as function-call defaults by design.
"src/splatoon3_ai_coach/cli/*.py" = ["B008"]
# Repo-root tools package mirrors production style but stays outside vision/.
"tools/vision_manifest_viewer/*.py" = ["E501"]
"tools/vmv_site/*.py" = ["E501", "B008"]
"tools/public_site/*.py" = ["E501", "B008"]
